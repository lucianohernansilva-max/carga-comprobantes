<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vencimientos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      min-width: 360px;
      max-width: 400px;
      color: #1e293b;
    }

    /* ── Header ── */
    .header {
      background: #1e3a5f;
      color: white;
      padding: 14px 16px 12px;
    }
    .header-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .header-sub {
      font-size: 11px;
      color: #93c5fd;
      margin-top: 1px;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 2px;
    }
    .btn-open {
      font-size: 10px;
      font-weight: 600;
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 5px;
      padding: 3px 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-open:hover { background: rgba(255,255,255,0.28); }

    /* ── Content ── */
    .content {
      padding: 10px 12px 12px;
      max-height: 480px;
      overflow-y: auto;
    }

    /* ── Empty / loading ── */
    .empty {
      text-align: center;
      padding: 28px 16px;
      color: #64748b;
      font-size: 12px;
    }
    .empty-icon { font-size: 28px; margin-bottom: 6px; }
    .empty-title { font-weight: 600; font-size: 13px; color: #334155; }

    /* ── Secciones ── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 10px 0 5px;
    }
    .section-label.hoy   { color: #dc2626; }
    .section-label.semana { color: #1e3a5f; }

    /* ── Tarjeta de vencimiento ── */
    .venc-card {
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      padding: 8px 10px;
      margin-bottom: 5px;
      background: white;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left-width: 4px;
    }
    .venc-card.urgencia-rojo   { border-left-color: #ef4444; background: #fff5f5; }
    .venc-card.urgencia-naranja{ border-left-color: #f97316; background: #fff8f0; }
    .venc-card.urgencia-amarillo{border-left-color: #eab308; background: #fefce8; }
    .venc-card.urgencia-normal { border-left-color: #e2e8f0; }

    .venc-fecha {
      min-width: 38px;
      text-align: center;
    }
    .venc-fecha .dia  { font-size: 17px; font-weight: 800; color: #1e293b; line-height: 1; }
    .venc-fecha .mes  { font-size: 9px;  font-weight: 600; color: #94a3b8; text-transform: uppercase; }

    .venc-info { flex: 1; min-width: 0; }
    .venc-tipo    { font-size: 12px; font-weight: 600; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .venc-cliente { font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .venc-dias { min-width: 44px; text-align: right; }
    .dias-chip {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 99px;
      display: inline-block;
    }
    .dias-hoy     { background: #fee2e2; color: #dc2626; }
    .dias-naranja { background: #ffedd5; color: #ea580c; }
    .dias-amarillo{ background: #fef9c3; color: #a16207; }
    .dias-normal  { background: #f1f5f9; color: #475569; }

    /* ── Footer ── */
    .footer {
      padding: 8px 12px;
      border-top: 1px solid #e2e8f0;
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-row">
      <div>
        <div class="header-title">Estudio Contable Cr. Luciano Silva</div>
        <div class="header-sub">M.P. 4201 — Vencimientos impositivos</div>
      </div>
      <a href="#" id="btnOpen" class="btn-open">Abrir app ↗</a>
    </div>
  </div>

  <div class="content" id="content">
    <div class="empty">
      <div class="empty-icon">⏳</div>
      <div class="empty-title">Cargando…</div>
    </div>
  </div>

  <div class="footer" id="footer">Actualizando…</div>

  <script src="popup.js"></script>
</body>
</html>
